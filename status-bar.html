<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冒险小队状态栏</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment: #f4e7c8;
      --parchment-dark: #d8c59b;
      --ink: #3a2b1a;
      --accent: #7a1212;
      --muted: #5c4b38;
      --shadow: 0 12px 24px rgba(0, 0, 0, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 35%),
                  radial-gradient(circle at 80% 40%, rgba(255,255,255,0.06), transparent 30%),
                  #0f0b0a;
      color: var(--ink);
      font-family: 'IM Fell English', 'Times New Roman', serif;
      padding: 32px;
    }

    .status-bar {
      display: grid;
      grid-template-columns: repeat(5, minmax(200px, 1fr));
      gap: 16px;
      width: min(1200px, 100%);
    }

    .card {
      position: relative;
      background: var(--parchment);
      border-radius: 18px;
      padding: 16px 14px 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 2px solid rgba(122, 18, 18, 0.35);
      isolation: isolate;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 55%),
                  linear-gradient(45deg, rgba(0,0,0,0.08), transparent 60%);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 0;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px dashed rgba(58, 43, 26, 0.25);
      border-radius: 12px;
      pointer-events: none;
      z-index: 0;
    }

    .header {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 12px;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 45%),
                  var(--parchment-dark);
      border: 3px solid rgba(122, 18, 18, 0.6);
      box-shadow: inset 0 0 0 2px rgba(244, 231, 200, 0.9), 0 6px 12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-weight: 600;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.5px;
    }

    .name {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: var(--ink);
      margin: 0;
      text-transform: uppercase;
    }

    .title {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
      opacity: 0.9;
      letter-spacing: 0.2px;
    }

    .affinity {
      margin: 14px 0 8px;
      position: relative;
      z-index: 1;
    }

    .label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress {
      position: relative;
      width: 100%;
      height: 10px;
      background: rgba(58, 43, 26, 0.18);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.12);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c6924b, #a05d2d, #7a1212);
      width: var(--value, 50%);
      border-radius: inherit;
      box-shadow: 0 0 8px rgba(122, 18, 18, 0.4);
    }

    .monologue {
      position: relative;
      z-index: 1;
      margin: 12px 0 0;
      padding: 10px 12px;
      background: rgba(216, 197, 155, 0.35);
      border-radius: 10px;
      border: 1px solid rgba(122, 18, 18, 0.25);
      font-size: 14px;
      line-height: 1.4;
      color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }

    @media (max-width: 1200px) {
      .status-bar {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <article class="card">
      <header class="header">
        <div class="avatar">A1</div>
        <div>
          <p class="name">艾拉瑞亚</p>
          <p class="title">流浪吟游诗人</p>
        </div>
      </header>
      <div class="affinity">
        <div class="label">
          <span>好感度</span>
          <span>72%</span>
        </div>
        <div class="progress" aria-label="好感度 72%">
          <div class="progress-fill" style="--value: 72%"></div>
        </div>
      </div>
      <p class="monologue">“每一段旋律都在记录我们的旅途。”</p>
    </article>

    <article class="card">
      <header class="header">
        <div class="avatar">A2</div>
        <div>
          <p class="name">布兰·石心</p>
          <p class="title">北境斥候</p>
        </div>
      </header>
      <div class="affinity">
        <div class="label">
          <span>好感度</span>
          <span>58%</span>
        </div>
        <div class="progress" aria-label="好感度 58%">
          <div class="progress-fill" style="--value: 58%"></div>
        </div>
      </div>
      <p class="monologue">“风会告诉我敌人的足迹。”</p>
    </article>

    <article class="card">
      <header class="header">
        <div class="avatar">A3</div>
        <div>
          <p class="name">莉雅·火纹</p>
          <p class="title">龙裔术士</p>
        </div>
      </header>
      <div class="affinity">
        <div class="label">
          <span>好感度</span>
          <span>85%</span>
        </div>
        <div class="progress" aria-label="好感度 85%">
          <div class="progress-fill" style="--value: 85%"></div>
        </div>
      </div>
      <p class="monologue">“火焰不仅吞噬，也照亮前路。”</p>
    </article>

    <article class="card">
      <header class="header">
        <div class="avatar">A4</div>
        <div>
          <p class="name">索林·白鹿</p>
          <p class="title">圣武士</p>
        </div>
      </header>
      <div class="affinity">
        <div class="label">
          <span>好感度</span>
          <span>64%</span>
        </div>
        <div class="progress" aria-label="好感度 64%">
          <div class="progress-fill" style="--value: 64%"></div>
        </div>
      </div>
      <p class="monologue">“誓言是我剑锋上的光。”</p>
    </article>

    <article class="card">
      <header class="header">
        <div class="avatar">A5</div>
        <div>
          <p class="name">玛格达·乌鸦冠</p>
          <p class="title">影歌猎手</p>
        </div>
      </header>
      <div class="affinity">
        <div class="label">
          <span>好感度</span>
          <span>47%</span>
        </div>
        <div class="progress" aria-label="好感度 47%">
          <div class="progress-fill" style="--value: 47%"></div>
        </div>
      </div>
      <p class="monologue">“黑夜掩护我，也考验我。”</p>
    </article>
  </div>
</body>
</html>
